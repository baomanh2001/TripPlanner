<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <radialGradient id="b2" cx="45%" cy="35%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ffe6f1"/>
    </radialGradient>
    <linearGradient id="scoot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8fbf"/><stop offset="100%" stop-color="#d84b8f"/>
    </linearGradient>
    <filter id="s2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a83c74" flood-opacity=".45"/>
