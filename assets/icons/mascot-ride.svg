      <ellipse cx="90" cy="30" rx="8" ry="20" fill="url(#b2)" transform="rotate(13 90 30)"/>
    </g>
    <!-- head -->
    <ellipse cx="75" cy="62" rx="31" ry="28" fill="url(#b2)" stroke="#8c3f68" stroke-width="3.5"/>
    <path d="M46 52 Q54 28 78 30 Q102 32 104 50 Q88 43 74 45 Q58 47 46 52 Z" fill="#ff7fb8" stroke="#8c3f68" stroke-width="3.5" stroke-linejoin="round"/>
