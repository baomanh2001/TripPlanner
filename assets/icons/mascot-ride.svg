    <rect x="52" y="60" width="46" height="14" rx="7" fill="#ffd9ea" stroke="#7d2a56" stroke-width="4"/>
    <circle cx="75" cy="126" r="9" fill="#5b2a44" stroke="#7d2a56" stroke-width="3"/>
