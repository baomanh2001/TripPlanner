      <ellipse cx="86" cy="64" rx="5" ry="6.5"/>
    </g>
    <circle cx="66" cy="61.5" r="2" fill="#fff"/>
    <circle cx="88" cy="61.5" r="2" fill="#fff"/>
    <ellipse cx="55" cy="72" rx="5.5" ry="3.5" fill="#ff9fc4" opacity=".8"/>
    <ellipse cx="95" cy="72" rx="5.5" ry="3.5" fill="#ff9fc4" opacity=".8"/>
    <path d="M70 76 Q75 81 80 76" fill="none" stroke="#4a2038" stroke-width="2.6" stroke-linecap="round"/>
